<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - محمد عيد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Cairo", sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(ellipse at center, #1a1510 0%, #0a0a0a 70%); }
        .login-box { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 48px 40px; text-align: center; width: 380px; max-width: 90vw; }
        .login-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #e7cb7b, #c4a44a); color: #0a0a0a; font-size: 36px; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .login-box h1 { color: #e7cb7b; font-size: 24px; margin-bottom: 8px; }
        .login-box > p { color: #777; font-size: 14px; margin-bottom: 32px; }
        .login-box input { width: 100%; padding: 14px 16px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #fff; font-family: "Cairo", sans-serif; font-size: 15px; outline: none; transition: border-color 0.3s; margin-bottom: 16px; text-align: center; }
        .login-box input:focus { border-color: #e7cb7b; }
        .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #e7cb7b, #c4a44a); color: #0a0a0a; border: none; border-radius: 10px; font-family: "Cairo", sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .login-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231, 203, 123, 0.3); }
        .login-error { color: #ff4444; font-size: 13px; margin-top: 12px; display: none; }
        .dashboard { min-height: 100vh; }
        .dash-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: #111; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .dash-logo { display: flex; align-items: center; gap: 12px; }
        .dash-logo .logo-symbol { width: 42px; height: 42px; background: linear-gradient(135deg, #e7cb7b, #c4a44a); color: #0a0a0a; font-size: 20px; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .dash-logo strong { color: #e7cb7b; font-size: 16px; display: block; }
        .dash-logo small { color: #777; font-size: 12px; }
        .dash-header-left { display: flex; align-items: center; gap: 16px; }
        .live-clock { color: #aaa; font-size: 14px; font-weight: 600; background: #1a1a1a; padding: 8px 16px; border-radius: 8px; }
        .refresh-btn { padding: 8px 20px; background: #1e1e1e; color: #e7cb7b; border: 1px solid #333; border-radius: 8px; font-family: "Cairo", sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .refresh-btn:hover { background: #2a2a2a; border-color: #e7cb7b; }
        .logout-btn { padding: 8px 20px; background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b33; border-radius: 8px; font-family: "Cairo", sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { background: #ff6b6b11; border-color: #ff6b6b; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 28px 32px; }
        .stat-card { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 24px; display: flex; align-items: center; gap: 16px; transition: border-color 0.3s; }
        .stat-card:hover { border-color: #333; }
        .stat-card.active-card { border-color: #2ecc7133; background: #0f1a14; }
        .stat-icon { font-size: 32px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border-radius: 12px; }
        .stat-number { display: block; font-size: 28px; font-weight: 800; color: #e7cb7b; }
        .stat-label { display: block; color: #888; font-size: 13px; margin-top: 2px; }
        .content-row { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 0 32px 32px; }
        .panel { background: #141414; border: 1px solid #222; border-radius: 14px; overflow: hidden; }
        .panel h2 { color: #e7cb7b; font-size: 16px; font-weight: 700; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid #222; }
        .panel-filters { display: flex; gap: 10px; align-items: center; }
        .filter-input { padding: 8px 12px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: "Cairo", sans-serif; font-size: 13px; outline: none; }
        .filter-input:focus { border-color: #e7cb7b; }
        .filter-btn { padding: 8px 14px; background: #1e1e1e; color: #aaa; border: 1px solid #333; border-radius: 8px; font-family: "Cairo", sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { color: #e7cb7b; border-color: #e7cb7b; }
        .table-wrapper { overflow-x: auto; max-height: 500px; overflow-y: auto; }
        .visitors-table { width: 100%; border-collapse: collapse; }
        .visitors-table th { padding: 14px 18px; text-align: right; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; background: #111; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 10; }
        .visitors-table td { padding: 14px 18px; font-size: 14px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
        .visitors-table tbody tr { transition: background 0.2s; }
        .visitors-table tbody tr:hover { background: #1a1a1a; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.online { background: #2ecc7122; color: #2ecc71; }
        .status-badge.offline { background: #ffffff0a; color: #666; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .status-badge.online .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .device-tag { display: inline-block; padding: 3px 10px; background: #1a1a1a; border-radius: 6px; font-size: 12px; color: #aaa; }
        .panel-footer { padding: 14px 24px; border-top: 1px solid #222; color: #666; font-size: 13px; text-align: center; }
        .side-panels { display: flex; flex-direction: column; gap: 24px; }
        .chart-panel, .device-panel { padding: 24px; }
        .chart-container { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .chart-bar-row { display: flex; align-items: center; gap: 12px; }
        .chart-bar-label { color: #888; font-size: 12px; min-width: 70px; text-align: left; }
        .chart-bar-track { flex: 1; height: 24px; background: #1a1a1a; border-radius: 6px; overflow: hidden; }
        .chart-bar-fill { height: 100%; background: linear-gradient(90deg, #e7cb7b, #c4a44a); border-radius: 6px; min-width: 2px; transition: width 0.6s ease; }
        .chart-bar-count { color: #e7cb7b; font-size: 13px; font-weight: 700; min-width: 24px; }
        .device-stats { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        .device-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1a1a1a; border-radius: 10px; }
        .device-stat-row span:first-child { color: #ccc; font-size: 14px; }
        .device-stat-row span:last-child { color: #e7cb7b; font-weight: 700; font-size: 18px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #555; }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; }
        @media (max-width: 1100px) { .content-row { grid-template-columns: 1fr; } .side-panels { flex-direction: row; } .side-panels .panel { flex: 1; } }
        @media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); padding: 20px 16px; } .content-row { padding: 0 16px 16px; } .dash-header { padding: 12px 16px; } .side-panels { flex-direction: column; } .live-clock { display: none; } }
        @media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-icon">ع</div>
            <h1>لوحة التحكم</h1>
            <p>محمد عيد - مدرس اللغة العربية</p>
            <input type="password" id="adminPassword" placeholder="كلمة المرور" autofocus>
            <button id="loginBtn">دخول</button>
            <p class="login-error" id="loginError">كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div class="dashboard" id="dashboard" style="display:none;">
        <header class="dash-header">
            <div class="dash-logo">
                <span class="logo-symbol">ع</span>
                <div>
                    <strong>لوحة التحكم</strong>
                    <small>محمد عيد</small>
                </div>
            </div>
            <div class="dash-header-left">
                <span class="live-clock" id="liveClock"></span>
                <button id="refreshBtn" class="refresh-btn">تحديث</button>
                <button id="logoutBtn" class="logout-btn">خروج</button>
            </div>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <span class="stat-number" id="totalVisitors">0</span>
                    <span class="stat-label">إجمالي الزوار</span>
                </div>
            </div>
            <div class="stat-card active-card">
                <div class="stat-icon">🟢</div>
                <div class="stat-info">
                    <span class="stat-number" id="activeNow">0</span>
                    <span class="stat-label">نشطون الآن</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-number" id="todayVisitors">0</span>
                    <span class="stat-label">زوار اليوم</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-info">
                    <span class="stat-number" id="avgDuration">0</span>
                    <span class="stat-label">متوسط المدة (دقيقة)</span>
                </div>
            </div>
        </div>

        <div class="content-row">
            <div class="panel visitors-panel">
                <div class="panel-header">
                    <h2>سجل الزوار</h2>
                    <div class="panel-filters">
                        <input type="date" id="filterDate" class="filter-input">
                        <button id="clearFilter" class="filter-btn">عرض الكل</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="visitors-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>وقت الدخول</th>
                                <th>وقت الخروج</th>
                                <th>المدة</th>
                                <th>الحالة</th>
                                <th>الجهاز</th>
                                <th>المصدر</th>
                            </tr>
                        </thead>
                        <tbody id="visitorsBody"></tbody>
                    </table>
                </div>
                <div class="panel-footer">
                    <span id="showingCount">0</span> من <span id="totalCount">0</span> زائر
                </div>
            </div>

            <div class="side-panels">
                <div class="panel chart-panel">
                    <h2>الزوار حسب اليوم</h2>
                    <div class="chart-container" id="dailyChart"></div>
                </div>
                <div class="panel device-panel">
                    <h2>أنواع الأجهزة</h2>
                    <div class="device-stats" id="deviceStats"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        const ADMIN_PASSWORD = "admin123";
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDqDvUDT4oJHjvN-qzWWyjdyX1cih3842Q",
            authDomain: "admin-html-a7b1e.firebaseapp.com",
            projectId: "admin-html-a7b1e",
            storageBucket: "admin-html-a7b1e.firebasestorage.app",
            messagingSenderId: "735145882658",
            appId: "1:735145882658:web:0656fe4e6e853da910467b"
        };
        let db, allVisitors = [], refreshInterval;
        const loginScreen = document.getElementById("loginScreen");
        const dashboard = document.getElementById("dashboard");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const adminPassword = document.getElementById("adminPassword");
        const loginError = document.getElementById("loginError");

        function doLogin() {
            if (adminPassword.value === ADMIN_PASSWORD) {
                loginScreen.style.display = "none";
                dashboard.style.display = "block";
                initFirebase();
            } else {
                loginError.style.display = "block";
                adminPassword.value = "";
                adminPassword.focus();
            }
        }
        loginBtn.addEventListener("click", doLogin);
        adminPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
        logoutBtn.addEventListener("click", () => {
            clearInterval(refreshInterval);
            dashboard.style.display = "none";
            loginScreen.style.display = "flex";
            adminPassword.value = "";
            loginError.style.display = "none";
        });

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const date = now.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
            document.getElementById("liveClock").textContent = date + " | " + time;
        }
        updateClock();
        setInterval(updateClock, 1000);

        function initFirebase() {
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.firestore();
            loadVisitors();
            refreshInterval = setInterval(loadVisitors, 10000);
        }

        function loadVisitors() {
            db.collection("visitors").orderBy("entryTime", "desc").limit(500).get()
                .then((snapshot) => {
                    allVisitors = [];
                    snapshot.forEach((doc) => { allVisitors.push({ id: doc.id, ...doc.data() }); });
                    updateStats();
                    renderTable(allVisitors);
                    renderChart();
                    renderDevices();
                }).catch((err) => { console.error("Error:", err); });
        }

        function updateStats() {
            document.getElementById("totalVisitors").textContent = allVisitors.length;
            document.getElementById("activeNow").textContent = allVisitors.filter((v) => v.isActive === true).length;
            const today = new Date().toISOString().split("T")[0];
            document.getElementById("todayVisitors").textContent = allVisitors.filter((v) => v.entryTime && v.entryTime.startsWith(today)).length;
            const withDuration = allVisitors.filter((v) => v.duration && v.duration > 0);
            const avgMin = withDuration.length > 0 ? Math.round(withDuration.reduce((s, v) => s + v.duration, 0) / withDuration.length / 60) : 0;
            document.getElementById("avgDuration").textContent = avgMin;
        }

        function formatDateTime(s) {
            if (!s) return "—";
            const d = new Date(s);
            return d.toLocaleDateString("ar-EG", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
        }
        function formatDuration(sec) {
            if (!sec || sec <= 0) return "—";
            if (sec < 60) return sec + " ثانية";
            const m = Math.floor(sec / 60), s = sec % 60;
            if (m < 60) return m + " د " + s + " ث";
            return Math.floor(m / 60) + " س " + (m % 60) + " د";
        }
        function parseDevice(ua) {
            if (!ua) return "غير معروف";
            ua = ua.toLowerCase();
            if (ua.includes("mobile") || (ua.includes("android") && !ua.includes("tablet"))) return "موبايل";
            if (ua.includes("tablet") || ua.includes("ipad")) return "تابلت";
            return "كمبيوتر";
        }
        function parseBrowser(ua) {
            if (!ua) return "";
            if (ua.includes("Edg/")) return "Edge";
            if (ua.includes("Chrome/")) return "Chrome";
            if (ua.includes("Firefox/")) return "Firefox";
            if (ua.includes("Safari/")) return "Safari";
            return "أخرى";
        }
        function getReferrer(r) {
            if (!r || r === "direct") return "مباشر";
            if (r.includes("google")) return "Google";
            if (r.includes("facebook")) return "Facebook";
            if (r.includes("twitter") || r.includes("x.com")) return "Twitter";
            if (r.includes("instagram")) return "Instagram";
            try { return new URL(r).hostname; } catch { return r; }
        }

        let currentDateFilter = null;
        document.getElementById("filterDate").addEventListener("change", (e) => { currentDateFilter = e.target.value; applyFilter(); });
        document.getElementById("clearFilter").addEventListener("click", () => { currentDateFilter = null; document.getElementById("filterDate").value = ""; applyFilter(); });
        function applyFilter() {
            if (!currentDateFilter) renderTable(allVisitors);
            else renderTable(allVisitors.filter((v) => v.entryTime && v.entryTime.startsWith(currentDateFilter)));
        }

        function renderTable(visitors) {
            const tbody = document.getElementById("visitorsBody");
            if (visitors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div><p>لا يوجد زوار بعد</p></div></td></tr>';
                document.getElementById("showingCount").textContent = "0";
                document.getElementById("totalCount").textContent = "0";
                return;
            }
            let html = "";
            visitors.forEach((v, i) => {
                html += '<tr><td style="color:#666;">' + (i + 1) + '</td><td>' + formatDateTime(v.entryTime) + '</td><td>' + formatDateTime(v.exitTime) + '</td><td>' + formatDuration(v.duration) + '</td><td><span class="status-badge ' + (v.isActive ? "online" : "offline") + '"><span class="status-dot"></span>' + (v.isActive ? "نشط" : "غير نشط") + '</span></td><td><span class="device-tag">' + parseDevice(v.userAgent) + ' / ' + parseBrowser(v.userAgent) + '</span></td><td style="color:#888;">' + getReferrer(v.referrer) + '</td></tr>';
            });
            tbody.innerHTML = html;
            document.getElementById("showingCount").textContent = visitors.length;
            document.getElementById("totalCount").textContent = allVisitors.length;
        }

        function renderChart() {
            const c = document.getElementById("dailyChart"), m = {};
            allVisitors.forEach((v) => { if (v.entryTime) { const d = v.entryTime.split("T")[0]; m[d] = (m[d] || 0) + 1; } });
            const s = Object.entries(m).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 7);
            if (!s.length) { c.innerHTML = '<div class="empty-state"><p>لا توجد بيانات كافية</p></div>'; return; }
            const mx = Math.max(...s.map((d) => d[1]));
            let h = "";
            s.forEach(([date, count]) => {
                const pct = mx > 0 ? (count / mx) * 100 : 0;
                const label = new Date(date + "T00:00:00").toLocaleDateString("ar-EG", { weekday: "short", day: "numeric", month: "short" });
                h += '<div class="chart-bar-row"><span class="chart-bar-label">' + label + '</span><div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%"></div></div><span class="chart-bar-count">' + count + '</span></div>';
            });
            c.innerHTML = h;
        }

        function renderDevices() {
            const c = document.getElementById("deviceStats"), m = {};
            allVisitors.forEach((v) => { const d = parseDevice(v.userAgent); m[d] = (m[d] || 0) + 1; });
            if (!Object.keys(m).length) { c.innerHTML = '<div class="empty-state"><p>لا توجد بيانات</p></div>'; return; }
            let h = "";
            Object.entries(m).sort((a, b) => b[1] - a[1]).forEach(([d, n]) => { h += '<div class="device-stat-row"><span>' + d + '</span><span>' + n + '</span></div>'; });
            c.innerHTML = h;
        }

        document.getElementById("refreshBtn").addEventListener("click", loadVisitors);
    </script>
</body>
</html>
